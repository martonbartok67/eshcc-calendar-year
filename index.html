<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESHCC Academic Calendar 2026–2027 | Erasmus University Rotterdam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="masthead-inner">
      <div class="masthead-titles">
        <div class="eyebrow">Erasmus School of History, Culture and Communication</div>
        <h1>Academic Calendar 2026–2027</h1>
      </div>
      <div class="masthead-actions no-print">
        <div class="tabs" role="tablist" aria-label="View">
          <button type="button" role="tab" data-action="view" data-view="year">Year</button>
          <button type="button" role="tab" data-action="view" data-view="terms">Terms</button>
        </div>
        <button type="button" class="pill-btn" data-action="today"><span class="today-dot"></span><span id="today-label"></span></button>
        <button type="button" class="pill-btn" data-action="print">Print / PDF</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="stack-14">
      <div class="section-head">
        <h2 class="kicker">The year in weeks</h2>
        <div class="legend" id="legend"></div>
      </div>
      <div class="card strip" id="strip"></div>
    </section>

    <section class="year-layout" id="year-view"></section>
    <section class="stack-14" id="terms-view" hidden></section>
  </main>
</div>
<script src="calendar-data.js"></script>
<script src="app.js"></script>
</body>
</html>
